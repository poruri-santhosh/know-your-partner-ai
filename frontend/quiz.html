<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Compatibility Questionnaire - Know Your Partner AI</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Top Navigation -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="brand">
        <div class="brand-icon">❤️</div>
        <span>KNOW YOUR PARTNER</span>
      </a>
      <div style="display: flex; align-items: center; gap: 16px;">
        <span id="answered-indicator" style="font-size: 0.9rem; color: var(--text-secondary);">
          0 / 40 Answered
        </span>
        <a href="index.html" class="btn btn-secondary btn-sm">Exit</a>
      </div>
    </div>
  </nav>

  <!-- Main Quiz Container -->
  <main class="quiz-wrapper">
    <!-- Progress Header -->
    <div class="quiz-header">
      <div class="quiz-meta">
        <span id="question-counter" style="font-weight: 700; color: #a5b4fc; font-size: 0.95rem;">
          Question 1 of 40
        </span>
        <div id="dimension-badge" class="dimension-badge">
          <span>💬</span>
          <span id="dimension-name">Communication</span>
        </div>
      </div>
      <div class="progress-track">
        <div id="progress-bar" class="progress-bar"></div>
      </div>
    </div>

    <!-- Active Question Card -->
    <div class="quiz-card" id="quiz-card">
      <h2 id="question-text" class="question-text">
        Loading question...
      </h2>

      <div id="options-container" class="options-list">
        <!-- Options rendered dynamically by quiz.js -->
      </div>

      <!-- Controls -->
      <div class="quiz-footer">
        <button id="btn-prev" class="btn btn-secondary" disabled>
          <span>←</span> Previous
        </button>
        <button id="btn-toggle-palette" class="drawer-toggle">
          <span>Overview (40)</span> ▾
        </button>
        <button id="btn-next" class="btn btn-primary">
          Next <span>→</span>
        </button>
      </div>

      <!-- Jump Palette Drawer (Collapsible) -->
      <div id="palette-drawer" style="display: none;">
        <div class="questions-palette" id="questions-palette">
          <!-- 40 pill buttons rendered by quiz.js -->
        </div>
      </div>
    </div>

    <div style="text-align: center; margin-top: 16px; color: var(--text-muted); font-size: 0.85rem;">
      Tip: Press <kbd style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px;">1-4</kbd> or <kbd style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px;">A-D</kbd> to choose; <kbd style="background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px;">Enter</kbd> to proceed.
    </div>
  </main>

  <script src="js/quiz.js"></script>
</body>
</html>
